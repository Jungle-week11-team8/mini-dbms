<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1000" height="360" fill="#ffffff"/>

  <!-- column backgrounds -->
  <rect x="20"  y="20" width="300" height="320" rx="14" fill="#EEF4FB"/>
  <rect x="340" y="20" width="350" height="320" rx="14" fill="#F1F7EE"/>
  <rect x="710" y="20" width="270" height="320" rx="14" fill="#FBF3EA"/>
  <text x="170" y="52" text-anchor="middle" font-size="18" font-weight="700" fill="#2B5C8A">입구</text>
  <text x="515" y="52" text-anchor="middle" font-size="18" font-weight="700" fill="#3D6B2E">엔진</text>
  <text x="845" y="52" text-anchor="middle" font-size="18" font-weight="700" fill="#8A5A23">저장</text>

  <!-- inputs -->
  <rect x="40" y="100" width="100" height="44" rx="8" fill="#fff" stroke="#9AA9B8" stroke-dasharray="4 3"/>
  <text x="90" y="127" text-anchor="middle" font-size="14" fill="#333">SQL 파일</text>
  <rect x="40" y="250" width="100" height="44" rx="8" fill="#fff" stroke="#9AA9B8" stroke-dasharray="4 3"/>
  <text x="90" y="277" text-anchor="middle" font-size="14" fill="#333">HTTP 요청</text>

  <rect x="170" y="96" width="130" height="52" rx="8" fill="#fff" stroke="#2B5C8A" stroke-width="1.6"/>
  <text x="235" y="127" text-anchor="middle" font-size="15" font-weight="600" fill="#1F3F5E">Main (CLI)</text>
  <rect x="170" y="238" width="130" height="80" rx="8" fill="#fff" stroke="#2B5C8A" stroke-width="1.6"/>
  <text x="235" y="266" text-anchor="middle" font-size="15" font-weight="600" fill="#1F3F5E">ApiServer</text>
  <text x="235" y="288" text-anchor="middle" font-size="12" fill="#555">스레드 풀 8개</text>
  <text x="235" y="306" text-anchor="middle" font-size="12" fill="#555">QueryHandler</text>

  <line x1="140" y1="122" x2="168" y2="122" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="140" y1="272" x2="168" y2="272" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- merge to parser -->
  <path d="M300,122 H325 V200 H373" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M300,278 H325 V200" fill="none" stroke="#555" stroke-width="1.6"/>

  <!-- engine -->
  <rect x="375" y="172" width="120" height="56" rx="8" fill="#fff" stroke="#3D6B2E" stroke-width="1.6"/>
  <text x="435" y="206" text-anchor="middle" font-size="15" font-weight="600" fill="#2B4A20">Parser</text>
  <line x1="495" y1="200" x2="533" y2="200" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="535" y="172" width="120" height="56" rx="8" fill="#fff" stroke="#3D6B2E" stroke-width="1.6"/>
  <text x="595" y="206" text-anchor="middle" font-size="15" font-weight="600" fill="#2B4A20">Executor</text>

  <!-- split to storage -->
  <path d="M655,200 H690 V122 H728" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M690,200 V278 H728" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="730" y="92" width="230" height="60" rx="8" fill="#fff" stroke="#8A5A23" stroke-width="1.6"/>
  <text x="845" y="117" text-anchor="middle" font-size="15" font-weight="600" fill="#5E3C15">Storage</text>
  <text x="845" y="138" text-anchor="middle" font-size="12" fill="#555">data/*.schema, *.csv</text>
  <rect x="730" y="248" width="230" height="60" rx="8" fill="#fff" stroke="#8A5A23" stroke-width="1.6"/>
  <text x="845" y="273" text-anchor="middle" font-size="15" font-weight="600" fill="#5E3C15">BPlusTree</text>
  <text x="845" y="294" text-anchor="middle" font-size="12" fill="#555">_id → 행 위치</text>
</svg>
