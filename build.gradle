plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0' // schema JSON 파싱용

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17 // JDK 17 이상이면 빌드 가능
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'minidb.Main'
    applicationDefaultJvmArgs = ['-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8']
}

tasks.test {
    useJUnitPlatform()
}

// 100만 건 인덱스 대 선형 탐색 속도 비교. 일반 테스트와 분리: ./gradlew bench
tasks.register('bench', JavaExec) {
    group = 'verification'
    description = '100만 건에서 _id 인덱스 조회와 선형 탐색의 속도를 비교한다 (결과: build/bench/result.txt)'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'minidb.bench.Benchmark'
    maxHeapSize = '2g' // 선형 탐색이 100만 행을 통째로 메모리에 올린다
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}
